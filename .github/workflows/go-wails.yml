name: Go and Wails

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-wails-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=mod

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm --filter dbx... install --frozen-lockfile --force
      - name: Check generated connection types are in sync
        run: node scripts/sync-connection-types.mjs --check
      - name: Run the full desktop test suite
        run: pnpm exec vitest run apps/desktop/src

  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./internal/... ./cmd/...
      - run: go build -o build/bin/dbx-web ./cmd/dbx-web
      - run: go build -o build/bin/dbx-mcp-go ./cmd/dbx-mcp
      - run: go vet ./internal/... ./cmd/...

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm --filter dbx... install --frozen-lockfile --force
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Test desktop adapters
        run: pnpm exec vitest run apps/desktop/src/lib/backend/wailsRuntime.spec.ts apps/desktop/src/lib/backend/wailsProgress.spec.ts apps/desktop/src/lib/__tests__/common/webPath.spec.ts
      - name: Test Go MCP settings and client configuration
        run: pnpm exec vitest run apps/desktop/src/components/settings/__tests__/GoMcpServerPanel.spec.ts apps/desktop/src/lib/backend/__tests__/goMcpHttp.spec.ts apps/desktop/src/lib/__tests__/mcp apps/desktop/src/stores/__tests__/settingsStore.spec.ts apps/desktop/src/components/editor/__tests__/EditorSettingsDialog.mcpQueryTimeout.spec.ts apps/desktop/src/components/editor/__tests__/EditorSettingsDialog.mcpQueryTimeout.integration.spec.ts
      - name: Test Go secure connection editors
        run: pnpm exec vitest run apps/desktop/src/components/connection/__tests__/ConnectionDialog.goSecure.spec.ts apps/desktop/src/lib/connection/goSecureConnections.spec.ts apps/desktop/src/components/ssh/__tests__/SshHostKeyPromptDialog.spec.ts apps/desktop/src/lib/__tests__/connection/tunnelProfiles.spec.ts
      - name: Test procedure execution and source pages
        run: >-
          pnpm exec vitest run
          apps/desktop/src/composables/__tests__/useSqlExecution.spec.ts
          apps/desktop/src/composables/__tests__/useProcedureExecutionDialog.spec.ts
          apps/desktop/src/components/objects/__tests__/ProcedureExecutionDialog.spec.ts
          apps/desktop/src/lib/__tests__/table/routineExecutionSql.spec.ts
          apps/desktop/src/lib/__tests__/table/routineParameters.xugu.spec.ts
          apps/desktop/src/components/objects/__tests__/ObjectBrowser.routineSourceTab.component.spec.ts
          apps/desktop/src/stores/__tests__/queryStore.objectSourcePending.spec.ts
      - run: pnpm typecheck
      - name: Build macOS or Windows desktop
        if: runner.os != 'Linux'
        run: pnpm build:wails
      - name: Build Linux desktop
        if: runner.os == 'Linux'
        run: pnpm build:wails -tags desktop,webkit2_41
      - name: Test native bindings
        if: runner.os != 'Linux'
        run: go test -tags desktop .
      - name: Test Linux native bindings
        if: runner.os == 'Linux'
        run: go test -tags desktop,webkit2_41 .
      - name: Test disposable HTTP workbench
        run: pnpm test:go-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: dbx-go-${{ runner.os }}
          path: build/wails/bin/
      - name: Smoke-launch the built macOS app
        if: runner.os == 'macOS'
        run: |
          APP_BIN="build/wails/bin/MagpieDB.app/Contents/MacOS/magpiedb"
          "$APP_BIN" > /tmp/magpie-smoke.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 15); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "MagpieDB exited during the 15s smoke window"
              cat /tmp/magpie-smoke.log
              exit 1
            fi
            sleep 1
          done
          kill "$APP_PID" 2>/dev/null || true
          echo "MagpieDB stayed alive for the 15s smoke window"
      - name: Package the macOS disk image
        if: runner.os == 'macOS'
        run: python3 scripts/package-go-macos.py --tag ci-${{ github.sha }} --output build/release/MagpieDB.dmg
      - name: Upload the macOS disk image
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: MagpieDB-macos-dmg
          path: |
            build/release/MagpieDB.dmg
            build/release/MagpieDB.dmg.sha256
            build/release/MagpieDB.dmg.manifest.json
